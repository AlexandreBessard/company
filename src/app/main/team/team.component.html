<section id="about" class="about-section py-5">
  <div class="container" data-aos="fade-up">

    <header class="section-header text-center mb-5">
      <h2>{{ 'about.section' | translate }}</h2>
    </header>

    <div class="row align-items-center gy-5">

      <!-- Photo -->
      <div class="col-lg-4 text-center" data-aos="zoom-in" data-aos-delay="100">
        <img ngSrc="assets/img/team/profil.jpeg"
             width="600" height="600"
             class="about-photo img-fluid rounded-4 shadow"
             alt="Alexandre Bessard"
             priority>
      </div>

      <!-- Text -->
      <div class="col-lg-8" data-aos="fade-left" data-aos-delay="200">
        <h3 class="fw-bold mb-1">Alexandre Bessard</h3>
        <p class="text-primary fw-semibold fs-5 mb-4">{{ 'about.title' | translate }}</p>

        <p [innerHTML]="'about.p1' | translate | sanitizeHtml"></p>
        <p [innerHTML]="'about.p2' | translate | sanitizeHtml"></p>
        <p [innerHTML]="'about.p3' | translate | sanitizeHtml"></p>

        <div class="d-flex flex-wrap gap-2 mt-4 mb-4">
          <span class="badge bg-success px-3 py-2 rounded-pill availability-badge">
            <span class="availability-dot"></span>
            {{ 'about.availability.label' | translate }}
          </span>
          <span class="badge bg-primary px-3 py-2 rounded-pill fs-6">
            {{ 'about.rate.label' | translate }}
          </span>
          <span class="badge bg-secondary px-3 py-2 rounded-pill fs-6">
            <i class="bi bi-laptop me-1"></i>{{ 'about.remote.label' | translate }}
          </span>
        </div>

        <div class="d-flex flex-wrap gap-3">
          <a href="https://www.linkedin.com/in/alexandre-bessard/" target="_blank" rel="noopener"
             class="btn btn-outline-primary">
            <i class="bi bi-linkedin me-2"></i>{{ 'about.linkedin' | translate }}
          </a>
          <a href="https://alexandrebessard.github.io/resume/" target="_blank" rel="noopener"
             class="btn btn-outline-secondary">
            <i class="bi bi-file-person me-2"></i>{{ 'about.cv' | translate }}
          </a>
        </div>
      </div>

    </div>
  </div>
</section>
