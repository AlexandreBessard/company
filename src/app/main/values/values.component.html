<section id="values" class="values py-5 bg-light">
  <div class="container" data-aos="fade-up">

    <header class="section-header text-center mb-5">
      <h2>{{ 'ourvalues.section' | translate }}</h2>
      <p class="text-muted">{{ 'ourvalues.title' | translate }}</p>
    </header>

    <div class="row justify-content-center align-items-center gy-4">

      <div class="col-md-4 text-center" data-aos="fade-right" data-aos-delay="100">
        <img src="assets/img/provigis/PROVIGIS-medal-bronze.png"
             class="img-fluid rounded-4 shadow-sm"
             style="max-width: 220px;"
             alt="Médaille Tiers Responsable Bronze Provigis">
        <p class="mt-3 fw-semibold mb-1">{{ 'provigis.medal.title' | translate }}</p>
        <p class="text-muted small">{{ 'provigis.medal.description' | translate }}</p>
      </div>

      <div class="col-md-7" data-aos="fade-left" data-aos-delay="200">
        <div class="p-4 rounded-4 bg-white shadow-sm">
          <h5 class="fw-bold mb-3">{{ 'ourvalues.collaboration.title' | translate }}</h5>
          <div [innerHTML]="'ourvalues.collaboration.description' | translate | sanitizeHtml"></div>
          <div class="mt-3">
            <iframe src="assets/img/provigis/CERTIFICATION_MEDAL_BRONZE_10_06_2025_1138.pdf"
                    width="100%" height="240px" style="border: none; border-radius: 8px;"
                    title="Certificat Provigis"></iframe>
          </div>
        </div>
      </div>

    </div>
  </div>
</section>
